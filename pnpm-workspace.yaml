auditLevel: "high"
blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
nodeLinker: "isolated"
preferFrozenLockfile: true
preferOffline: false
resolvePeersFromWorkspaceRoot: true
strictPeerDependencies: true
trustPolicy: "no-downgrade"

packages:
  - "apps/*"
  - "packages/*"

catalog:
  typescript: "5.9.3"
